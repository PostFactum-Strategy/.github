<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FFAA00"/>
    </linearGradient>
  </defs>

  <!-- Card 1 -->
  <g transform="translate(10, 10)">
    <rect width="340" height="180" rx="6" fill="url(#cardGrad)" stroke="#222" stroke-width="1"/>
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#glow)" stroke-width="3"/>
    <text x="25" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FF5500" font-weight="700" letter-spacing="2">01 // РЕЛЯТИВИЗМ ДВИЖКА</text>
    <text x="25" y="70" font-family="'Inter', sans-serif" font-size="18" fill="#FFF" font-weight="800" letter-spacing="1">Субмиллисекундный Edge CV</text>
    <text x="25" y="105" font-family="'Inter', sans-serif" font-size="12" fill="#888">
      Ноль тяжелых внешних рантаймов.
    </text>
    <text x="25" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#888">
      Чистая детерминированная топология,
    </text>
    <text x="25" y="145" font-family="'Inter', sans-serif" font-size="12" fill="#888">
      работающая на железе за &lt; 5 мс.
    </text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(380, 10)">
    <rect width="340" height="180" rx="6" fill="url(#cardGrad)" stroke="#222" stroke-width="1"/>
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#glow)" stroke-width="3"/>
    <text x="25" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FF5500" font-weight="700" letter-spacing="2">02 // УСИЛЕНИЕ ЧЕЛОВЕКА</text>
    <text x="25" y="70" font-family="'Inter', sans-serif" font-size="18" fill="#FFF" font-weight="800" letter-spacing="1">Анти-Технофашизм</text>
    <text x="25" y="105" font-family="'Inter', sans-serif" font-size="12" fill="#888">
      Освобождаем интуицию человека и
    </text>
    <text x="25" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#888">
      уравниваем шансы против хищных
    </text>
    <text x="25" y="145" font-family="'Inter', sans-serif" font-size="12" fill="#888">
      корпораций и скрытых бот-сетей.
    </text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(750, 10)">
    <rect width="340" height="180" rx="6" fill="url(#cardGrad)" stroke="#222" stroke-width="1"/>
    <line x1="0" y1="0" x2="60" y2="0" stroke="url(#glow)" stroke-width="3"/>
    <text x="25" y="40" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FF5500" font-weight="700" letter-spacing="2">03 // СВОБОДА ПРОТОКОЛА</text>
    <text x="25" y="70" font-family="'Inter', sans-serif" font-size="18" fill="#FFF" font-weight="800" letter-spacing="1">Суверенные Данные</text>
    <text x="25" y="105" font-family="'Inter', sans-serif" font-size="12" fill="#888">
      Универсальный открытый стандарт
    </text>
    <text x="25" y="125" font-family="'Inter', sans-serif" font-size="12" fill="#888">
      (PFS-EHF), возвращающий право на
    </text>
    <text x="25" y="145" font-family="'Inter', sans-serif" font-size="12" fill="#888">
      историю раздач самому сообществу.
    </text>
  </g>
</svg>
